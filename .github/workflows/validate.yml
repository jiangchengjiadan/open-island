name: Validate

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: bridge/package-lock.json

      - name: Install bridge dependencies
        run: npm ci
        working-directory: bridge

      - name: Check bridge scripts
        run: |
          chmod +x scripts/sync-app-runtime.sh
          ./scripts/sync-app-runtime.sh
          git diff --exit-code -- native/NotchMonitor/Sources/AppRuntime
          node --check bridge/server.js
          node --check bridge/hook.js
          node --check bridge/codex-wrapper.js
          node --check bridge/utils.js
          node --check bridge/integrations/*.js
          node --check native/NotchMonitor/Sources/AppRuntime/bridge/server.js
          node --check native/NotchMonitor/Sources/AppRuntime/bridge/hook.js
          node --check native/NotchMonitor/Sources/AppRuntime/bridge/codex-wrapper.js
          node --check native/NotchMonitor/Sources/AppRuntime/bridge/utils.js
          node --check native/NotchMonitor/Sources/AppRuntime/bridge/integrations/*.js

      - name: Test bridge
        run: npm test
        working-directory: bridge

      - name: Test Swift core
        run: swift test --filter OpenIslandCoreTests
        working-directory: native/NotchMonitor

      - name: Build Swift app
        run: swift build
        working-directory: native/NotchMonitor
